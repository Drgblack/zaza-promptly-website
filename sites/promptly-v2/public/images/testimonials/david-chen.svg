<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #10b981; }
      .text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 60px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .circle { fill: rgba(255,255,255,0.1); }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" class="bg"/>
  
  <!-- Subtle inner circle for depth -->
  <circle cx="100" cy="100" r="85" class="circle"/>
  
  <!-- Person silhouette -->
  <circle cx="100" cy="75" r="25" fill="rgba(255,255,255,0.2)"/>
  <path d="M 60 160 Q 100 130 140 160 L 140 200 L 60 200 Z" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Initials -->
  <text x="100" y="100" class="text">DC</text>
</svg>