<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone frame -->
  <rect x="120" y="20" width="160" height="260" rx="20" fill="#1f2937" stroke="#374151" strokeWidth="2"/>
  
  <!-- Screen -->
  <rect x="130" y="40" width="140" height="220" rx="12" fill="#0f172a"/>
  
  <!-- Status bar -->
  <rect x="140" y="50" width="120" height="16" fill="#1e293b"/>
  <circle cx="145" cy="58" r="2" fill="#10b981"/>
  <rect x="240" y="55" width="15" height="6" rx="3" fill="#64748b"/>
  
  <!-- Header -->
  <rect x="140" y="80" width="120" height="30" fill="#1e293b"/>
  <text x="200" y="99" textAnchor="middle" fill="#f1f5f9" fontSize="10" fontWeight="600">Promptly</text>
  
  <!-- Content cards -->
  <rect x="145" y="120" width="110" height="25" rx="8" fill="#3b82f6"/>
  <text x="200" y="135" textAnchor="middle" fill="white" fontSize="8">Parent Message</text>
  
  <rect x="145" y="155" width="110" height="25" rx="8" fill="#6366f1"/>
  <text x="200" y="170" textAnchor="middle" fill="white" fontSize="8">Report Comments</text>
  
  <rect x="145" y="190" width="110" height="25" rx="8" fill="#8b5cf6"/>
  <text x="200" y="205" textAnchor="middle" fill="white" fontSize="8">Quick Helper</text>
  
  <!-- Bottom navigation -->
  <rect x="140" y="230" width="120" height="20" fill="#1e293b"/>
  <circle cx="155" cy="240" r="3" fill="#6366f1"/>
  <circle cx="185" cy="240" r="3" fill="#64748b"/>
  <circle cx="215" cy="240" r="3" fill="#64748b"/>
  <circle cx="245" cy="240" r="3" fill="#64748b"/>
  
  <!-- Floating elements for visual interest -->
  <circle cx="80" cy="80" r="8" fill="#6366f1" fillOpacity="0.2"/>
  <circle cx="320" cy="120" r="12" fill="#8b5cf6" fillOpacity="0.15"/>
  <rect x="50" y="180" width="20" height="20" rx="4" fill="#3b82f6" fillOpacity="0.1"/>
  <rect x="330" y="200" width="15" height="15" rx="3" fill="#6366f1" fillOpacity="0.2"/>
</svg>