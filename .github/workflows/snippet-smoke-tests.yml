name: Snippet Smoke Tests

on:
  pull_request:
    paths:
      - 'sites/promptly-v2/src/app/api/improve-comment/**'
      - 'sites/promptly-v2/src/components/sections/SnippetToolV2.tsx'
      - 'sites/promptly-v2/src/components/sections/SnippetDemo.tsx'
      - 'sites/promptly-v2/scripts/snippet-smoke.test.ts'
      - 'sites/promptly-v2/package.json'
      - '.github/workflows/snippet-smoke-tests.yml'

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  smoke-test:
    name: Snippet API Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sites/promptly-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sites/promptly-v2/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          SKIP_SITEMAP: true
          NODE_ENV: production

      - name: Start application in background
        run: |
          npm start &
          echo $! > server.pid
        env:
          PORT: 3000
          NODE_ENV: production

      - name: Wait for server to be ready
        run: |
          timeout 30s bash -c 'until curl -f http://localhost:3000/api/improve-comment -X POST -H "Content-Type: application/json" -d "{\"draft\":\"test\"}" 2>/dev/null; do sleep 1; done' || exit 1

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          API_BASE_URL: http://localhost:3000
          NODE_ENV: test
          # Add any required API keys as secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi
          # Kill any remaining processes on port 3000
          pkill -f "next start" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            sites/promptly-v2/coverage/
            sites/promptly-v2/test-results/
          retention-days: 7

  security-check:
    name: Security and Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: sites/promptly-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sites/promptly-v2/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check for banned words in API code
        run: |
          echo "Checking API route for banned words..."
          if grep -i -E '\b(problem|lazy|stupid)\b' src/app/api/improve-comment/route.ts; then
            echo "❌ Found banned words in API route. These should only appear in test data or as examples to avoid."
            exit 1
          else
            echo "✅ No banned words found in API route"
          fi

      - name: Validate test coverage of edge cases
        run: |
          echo "Validating smoke test coverage..."
          if ! grep -q "Handles empty draft gracefully" scripts/snippet-smoke.test.ts; then
            echo "❌ Missing edge case test for empty draft"
            exit 1
          fi
          if ! grep -q "very long draft" scripts/snippet-smoke.test.ts; then
            echo "❌ Missing edge case test for long draft"
            exit 1
          fi
          echo "✅ Edge case tests present"

      - name: Check quality thresholds
        run: |
          echo "Validating quality thresholds in tests..."
          if ! grep -q "toBeGreaterThanOrEqual(0.8)" scripts/snippet-smoke.test.ts; then
            echo "❌ Quality threshold not set to 0.8 or higher"
            exit 1
          fi
          if ! grep -q "toBeGreaterThanOrEqual(2)" scripts/snippet-smoke.test.ts; then
            echo "❌ Strategy phrase count threshold not set to 2 or higher"
            exit 1
          fi
          echo "✅ Quality thresholds properly configured"

      - name: Lint and type check
        run: |
          npm run lint
          npx tsc --noEmit

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [smoke-test, security-check]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Comment on PR - Success
        if: needs.smoke-test.result == 'success' && needs.security-check.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Snippet Smoke Tests Passed** 🎉\n\nAll quality and safety checks passed:\n- API quality score ≥ 0.8\n- Strategy phrases ≥ 2 per response\n- No banned words in output\n- Security checks passed\n\nThe snippet API is ready for production!'
            })

      - name: Comment on PR - Failure
        if: needs.smoke-test.result != 'success' || needs.security-check.result != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const smokeResult = '${{ needs.smoke-test.result }}'
            const securityResult = '${{ needs.security-check.result }}'
            
            let body = '❌ **Snippet Smoke Tests Failed**\n\n'
            
            if (smokeResult !== 'success') {
              body += '- 🔥 Smoke tests failed - check quality scores, strategy phrases, or banned words\n'
            }
            
            if (securityResult !== 'success') {
              body += '- 🔒 Security checks failed - review code for banned words or missing validations\n'
            }
            
            body += '\nPlease review the test results and fix the issues before merging.'
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })