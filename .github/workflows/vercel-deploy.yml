name: vercel deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Check required secrets are present
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID missing"; exit 1; }

      # Discover orgId if not set and write .vercel/project.json so 'vercel' knows the project
      - name: Link Vercel project
        run: |
          if [ -z "$VERCEL_ORG_ID" ]; then
            VERCEL_ORG_ID="$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/projects/$VERCEL_PROJECT_ID" | jq -r '.accountId')"
          fi
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg proj "$VERCEL_PROJECT_ID" \
            '{orgId:$org, projectId:$proj}' > .vercel/project.json
          echo "Wrote .vercel/project.json:"
          cat .vercel/project.json

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      # ---------- Focus the real build error ----------
      - name: Build (capture log)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Summarize first errors
        run: |
          echo "---- FIRST ERRORS (context) ----"
          awk '
            /Error:|ERR!/ {for(i=NR-8;i<=NR+20;i++){ if(i>0) print buf[i%2000] } exit}
            { buf[NR%2000]=$0 }
          ' build.log || true
          echo "---- END SUMMARY ----"

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # If build succeeds, do the Vercel production deploy from the prebuilt output
      - name: Deploy to production (alias)
        if: ${{ success() }}
        run: vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
