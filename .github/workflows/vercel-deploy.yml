name: Deploy to Vercel
on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "src/**"
      - "components/**"
      - "lib/**"
      - "middleware.ts"
      - "next.config.js"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/vercel-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy (Production)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK"