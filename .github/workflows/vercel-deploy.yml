name: vercel deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Check required secrets are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && echo "VERCEL_TOKEN=SET" || (echo "VERCEL_TOKEN=MISSING"; exit 1)
          test -n "$VERCEL_PROJECT_ID" && echo "VERCEL_PROJECT_ID=SET" || (echo "VERCEL_PROJECT_ID=MISSING"; exit 1)
          if [ -n "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID=SET"; else echo "VERCEL_ORG_ID=EMPTY (ok)"; fi

      # NEW: write .vercel/project.json so 'vercel pull' doesn't need --project
      - name: Link Vercel project (create .vercel/project.json)
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          mkdir -p .vercel
          if [ -n "$VERCEL_ORG_ID" ]; then
            echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          else
            echo "{\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
          fi
          echo "Wrote .vercel/project.json:"
          cat .vercel/project.json

      - name: Pull Vercel env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          SCOPE_ARG=""
          if [ -n "$VERCEL_ORG_ID" ]; then SCOPE_ARG="--scope $VERCEL_ORG_ID"; fi
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN" $SCOPE_ARG

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token "$VERCEL_TOKEN"

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          SCOPE_ARG=""
          if [ -n "$VERCEL_ORG_ID" ]; then SCOPE_ARG="--scope $VERCEL_ORG_ID"; fi
          vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" $SCOPE_ARG
