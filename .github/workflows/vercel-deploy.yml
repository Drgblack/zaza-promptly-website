name: vercel deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Check required secrets are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && echo "VERCEL_TOKEN=SET" || (echo "VERCEL_TOKEN=MISSING"; exit 1)
          test -n "$VERCEL_PROJECT_ID" && echo "VERCEL_PROJECT_ID=SET" || (echo "VERCEL_PROJECT_ID=MISSING"; exit 1)
          if [ -n "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID=SET"; else echo "VERCEL_ORG_ID=EMPTY (auto-detect)"; fi

      - name: Discover orgId for the project
        id: org
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -n "$VERCEL_ORG_ID" ]; then
            echo "ORG_ID=$VERCEL_ORG_ID" >> $GITHUB_OUTPUT
            exit 0
          fi
          RESP=$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" || true)
          ORG_ID=$(printf "%s" "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('accountId',''))")
          if [ -z "$ORG_ID" ]; then
            echo "Failed to auto-detect orgId. Please add VERCEL_ORG_ID secret (team_... or user_...)."
            exit 1
          fi
          echo "Detected ORG_ID=$ORG_ID"
          echo "ORG_ID=$ORG_ID" >> $GITHUB_OUTPUT

      - name: Link Vercel project (create .vercel/project.json)
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ORG_ID: ${{ steps.org.outputs.ORG_ID }}
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$ORG_ID\"}" > .vercel/project.json
          echo "Wrote .vercel/project.json:"
          cat .vercel/project.json

      - name: Pull Vercel env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG_ID: ${{ steps.org.outputs.ORG_ID }}
        run: |
          SCOPE_ARG=""
          if [ -n "$ORG_ID" ]; then SCOPE_ARG="--scope $ORG_ID"; fi
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN" $SCOPE_ARG

      # 🔎 DEBUG: find where redirects are defined
      - name: Debug: locate redirects definitions
        run: |
          echo "===
