name: vercel deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD_DOMAIN: ${{ secrets.PROD_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm i --no-audit --no-fund
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Check required secrets are present
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN missing"; exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "VERCEL_PROJECT_ID missing"; exit 1)

      - name: Discover orgId (accountId)
        id: org
        shell: bash
        run: |
          set -euo pipefail
          RES=$(curl -sfL -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          ORG_ID=$(echo "$RES" | jq -r '.accountId // empty')
          echo "org=$ORG_ID" >> "$GITHUB_OUTPUT"

      - name: Link Vercel project (create .vercel/project.json)
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "${{ steps.org.outputs.org }}",
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
          }
          JSON

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token "$VERCEL_TOKEN"

      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ steps.org.outputs.org }}
        run: |
          SCOPE_ARG=""
          if [ -n "$VERCEL_ORG_ID" ]; then SCOPE_ARG="--scope $VERCEL_ORG_ID"; fi
          vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" $SCOPE_ARG
