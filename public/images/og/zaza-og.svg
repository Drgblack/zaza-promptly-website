<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="og-logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4081;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="og-highlight" x1="0%" y1="0%" x2="40%" y2="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-background)" />
  
  <!-- Logo on the left -->
  <g transform="translate(80, 165)">
    <!-- Logo background rounded square -->
    <rect x="0" y="0" width="300" height="300" rx="75" ry="75" fill="url(#og-logo-gradient)" />
    
    <!-- Subtle highlight for 3D effect -->
    <path d="M 75 0 A 75 75 0 0 1 0 75 L 0 37.5 A 37.5 37.5 0 0 1 37.5 0 Z" fill="url(#og-highlight)" />
    
    <!-- Letter Z -->
    <path d="M 90 75 L 210 75 A 15 15 0 0 1 210 105 L 135 105 L 210 195 L 210 210 A 15 15 0 0 1 195 225 L 90 225 A 15 15 0 0 1 90 195 L 165 195 L 90 105 L 90 90 A 15 15 0 0 1 90 75 Z" fill="#FFFFFF" />
  </g>
  
  <!-- Text content on the right -->
  <g transform="translate(430, 180)">
    <!-- Main title -->
    <text x="0" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="700" fill="#1F2937">
      Zaza Promptly
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="120" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="400" fill="#6B7280">
      AI Comments. Done in seconds.
    </text>
    
    <!-- Description -->
    <text x="0" y="180" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="400" fill="#9CA3AF">
      Revolutionary AI-powered comment generation
    </text>
    <text x="0" y="220" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="400" fill="#9CA3AF">
      for educators. Save hours, maintain quality.
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="3" fill="#FF4081" opacity="0.6" />
  <circle cx="1100" cy="200" r="2" fill="#E91E63" opacity="0.4" />
  <circle cx="1080" cy="250" r="4" fill="#9C27B0" opacity="0.5" />
  
  <!-- Bottom branding -->
  <text x="600" y="580" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="middle">
    www.zazapromptly.com
  </text>
</svg>